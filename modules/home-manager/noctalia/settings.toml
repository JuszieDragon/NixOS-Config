[plugins]
enabled = [ "rylos/syncthing" ]

[shell]
polkit_agent = true
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[wallpaper]
directory = "/home/justin/Pictures/Wallpapers"
transition = [ "fade" ]
transition_duration = 500
transition_on_startup = true

    [wallpaper.default]
    path = "/home/justin/Pictures/Wallpapers/Disco.png"

    [wallpaper.last]
    path = "/home/justin/Pictures/Wallpapers/Disco.png"

    [wallpaper.monitors.DP-1]
    path = "/home/justin/Pictures/Wallpapers/Disco.png"

    [wallpaper.monitors.DP-2]
    path = "/home/justin/Pictures/Wallpapers/Disco.png"

    [wallpaper.monitors.DP-3]
    path = "/home/justin/Pictures/Wallpapers/Disco.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/justin/Pictures/Wallpapers/Disco.png"

[weather]
refresh_minutes = 5

[widget.bar]
type = "rylos/syncthing:bar"

[widget.clock]
format = "{:%-I:%M %p} {:%d-%m-%Y}"