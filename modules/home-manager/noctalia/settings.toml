config_version = 14

[bar.default]
capsule = true
end = [
    "media",
    "bar",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_edge = 0
margin_ends = 0
radius = 0
shadow = false
start = [ "launcher", "wallpaper", "workspaces", "cpu", "ram" ]

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "clipboard"

[desktop_widgets]
enabled = false

[idle]
pre_action_fade_seconds = 0

[location]
address = "Glenorchy"

